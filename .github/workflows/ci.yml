# What runs on every push, and why each job can stop the build.
#
# This repository ships a static site: there is no runtime in production, so the
# usual test pyramid has nothing to stand on. What can go wrong is narrower, and
# these four jobs are the whole of it — the build, the dependencies, the
# cryptography the source contains, and the cryptography the live server
# negotiates.
name: CI

on:
  push:
  pull_request:
  # The TLS job also runs on its own, daily: a certificate is renewed, a cipher
  # suite is dropped, and neither event is a commit.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the site
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v5
      -
        # gd with FreeType is not optional here: the sharing cards are drawn at
        # build time, and without it every piece ships without its image.
        name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, mbstring, dom
          coverage: none
      -
        name: Install the dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      -
        name: Build
        run: php bin/build.php
      -
        # A build that writes nothing exits 0 just as happily as one that works.
        name: Check the output exists
        run: |
          pages=$(find public -name index.html | wc -l | tr -d ' ')
          cards=$(find public/cards -name '*.png' | wc -l | tr -d ' ')
          printf '  %s pages, %s cards\n' "$pages" "$cards"
          test "$pages" -gt 10
          test "$cards" -gt 10
          test -s public/sitemap.xml
      -
        # `deploy` turns this list into one directory per publication date on the
        # server. A single stray line on stdout — a PHP warning, once — became
        # nine release directories, each holding a full copy of the site. The
        # list must contain dates and nothing else.
        name: The release dates are dates
        run: |
          php bin/build.php --release-dates | tee /tmp/dates
          ! grep -qvE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' /tmp/dates

  # Runs on the daily schedule as well as on pushes, which is the whole point: a
  # dependency with no known advisory today is not a dependency with no known
  # advisory in March, and this site goes weeks without a commit. The build and
  # the source inventory stay on pushes — they can only change when the files do.
  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v5
      -
        name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      -
        # --locked reads composer.lock, so what is checked is what gets deployed
        # rather than what a fresh resolution would pick today. Three packages,
        # and the site's own published inventory names their versions — which is
        # a claim about them being sound, and this is what checks it.
        name: Advisories
        run: |
          composer validate --strict --no-check-publish
          composer audit --locked --no-interaction

  cryptography:
    name: Cryptography in the source
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v5
      -
        name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium, openssl, json
          coverage: none
      -
        # A tag, not a branch: this decides whether the build passes.
        name: Get Sablier
        run: git clone --depth 1 --branch v0.8.0 https://github.com/mesa-black/sablier.git "$RUNNER_TEMP/sablier"
      -
        # The reference records zero findings, which is the point: a static site
        # generator contains no cryptography, and this job exists to notice the
        # day that stops being true. Capture it from what is versioned, never
        # from a working tree —
        #   T=$(mktemp -d); git archive HEAD | tar -x -C "$T"
        #   sablier scan "$T" --json=.sablier/baseline.json --no-probe
        # — because a tree carrying a built public/ produces findings this job
        # will never see, and the run then reports them as gone on every push.
        #
        # No --sign: the signing key is personal, it is built for one report and
        # destroyed afterwards, and it has no business on a runner. CI checks the
        # inventory; a person signs it.
        name: Inventory the cryptography
        run: |
          php "$RUNNER_TEMP/sablier/bin/sablier" scan . \
            --baseline=.sablier/baseline.json \
            --out="$RUNNER_TEMP/report.html" \
            --audit="$RUNNER_TEMP/audit.html" \
            --lang=en \
            --no-probe
      -
        # if: always() — the run you most want to read is the one that failed.
        name: Keep both reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptography
          path: |
            ${{ runner.temp }}/report.html
            ${{ runner.temp }}/audit.html

  tls:
    name: Cryptography on the wire
    # Pinned, where every other job floats. The probe measures a *pair* — what
    # this client and that server agree on — so a runner image that changes its
    # OpenSSL changes the findings without anything on mesa.black moving, and the
    # reference would drift under us. ubuntu-latest becomes Ubuntu 26 on 19
    # October 2026, which is exactly that event.
    runs-on: ubuntu-24.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v5
      -
        name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium, openssl, json
          coverage: none
      -
        name: Get Sablier
        run: git clone --depth 1 --branch v0.8.0 https://github.com/mesa-black/sablier.git "$RUNNER_TEMP/sablier"
      -
        # Its own reference, separate from the source one: these findings come
        # from a handshake rather than from a file, so mixing them into the source
        # baseline would make a certificate renewal look like a commit that added
        # cryptography.
        #
        # --lang=en because the reference is committed and read in review: every
        # machine field is language-independent, and `because` is prose that
        # follows the report's language, so capturing in one language and running
        # in another would leave a diff that is pure translation.
        #
        # And the reference is captured *here*, from this image, not from a
        # laptop. The first run of this job proved why: locally the handshake
        # negotiates X25519MLKEM768 and the probe records ml-kem; from the runner
        # it negotiated plain ECDH, because that client's OpenSSL does not offer
        # the hybrid group. Nothing was wrong with the server — the probe reports
        # what two machines agreed on, and a reference taken on one of them says
        # nothing about the other.
        #
        # So this job has a blind spot it cannot close: it cannot see whether
        # mesa.black still offers ML-KEM, because its client never asks. What it
        # does see is the rest of the handshake — the certificate's algorithm and
        # strength, the protocol versions — which is what quietly regresses. The
        # ML-KEM half is checked at every deploy, by `make audit`, from a client
        # that offers it. Said here rather than left for somebody to discover in
        # a green run that proves less than it looks.
        name: Probe the live site
        run: |
          php "$RUNNER_TEMP/sablier/bin/sablier" scan . \
            --baseline=.sablier/wire.json \
            --json="$RUNNER_TEMP/observed.json" \
            --lang=en \
            --out="$RUNNER_TEMP/wire.html"
      -
        name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wire
          path: |
            ${{ runner.temp }}/wire.html
            ${{ runner.temp }}/observed.json

  # ---------------------------------------------------------------- delivery
  # Only for a push to main, and only once the site builds, its dependencies
  # are clean and its source inventory matches. The TLS probe is not in `needs`
  # on purpose: it measures the live server, which a commit to this repository
  # does not change — blocking a fix because a certificate is being renewed
  # would block the very fix that might be needed.
  image:
    name: Image
    needs: [build, dependencies, cryptography]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The repository's default token is read-only; this job alone may write
    # packages. No personal token involved: the image is pushed by the
    # workflow's own GITHUB_TOKEN, which expires with the run.
    permissions:
      contents: read
      packages: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@v5
      -
        # The day the image is built for, in Paris: passed to the build rather
        # than read from the clock inside it (the Dockerfile says why).
        name: Build day
        id: day
        run: echo "date=$(TZ=Europe/Paris date +%F)" >> "$GITHUB_OUTPUT"
      -
        name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        # Two architectures without QEMU: the build stage runs on the runner's
        # own platform, the final stage only copies files.
        #
        # Tagged with the full commit SHA, never `latest`: the deployment
        # repository names exactly which build runs, and going back is a revert.
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SITE_DATE=${{ steps.day.outputs.date }}
          tags: ghcr.io/mesa-black/labs:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=BlackMesa Labs, every dated version of the site, served by Caddy
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # GitOps: CI never talks to the cluster. It changes one line in the
  # deployment repository, and Argo CD, which watches that repository, does the
  # rest. A deployment is therefore a commit there: history, review, and
  # `git revert` as the rollback.
  deploy:
    name: Deploy (commit to k3s-stack)
    needs: image
    runs-on: ubuntu-latest
    # Two pushes in a row must not race each other's commit. Queued, never
    # cancelled: a cancelled deploy would leave the older image running.
    concurrency:
      group: deploy-labs
      cancel-in-progress: false
    steps:
      -
        # A deploy key with write access to k3s-stack, and to nothing else.
        # Its private half is a secret of this repository.
        name: Checkout the deployment repository
        uses: actions/checkout@v5
        with:
          repository: mesa-black/k3s-stack
          ssh-key: ${{ secrets.K3S_STACK_DEPLOY_KEY }}
          path: k3s-stack
      -
        # yq rather than `kustomize edit set image`: kustomize rewrites the whole
        # file and drops its comments.
        name: Point the blog at this build
        working-directory: k3s-stack
        run: |
          yq -i '(.images[] | select(.name == "ghcr.io/mesa-black/labs")).newTag = "${{ github.sha }}"' \
            spoke/apps/labs/kustomization.yaml
          git diff --stat
      -
        # The message carries the source commit, so that the deployment history
        # leads back to the code. A re-run with nothing to change commits nothing.
        name: Commit and push
        working-directory: k3s-stack
        env:
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          git diff --quiet && { echo "already deployed"; exit 0; }
          # First line of the source commit's message. Computed here: inside a
          # here-document, $'\n' quoting is not interpreted.
          subject=${SUBJECT%%$'\n'*}
          git config user.name 'labs CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -a -F - <<MSG
          labs: deploy ${GITHUB_SHA::7}

          ${subject}

          https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          MSG
          for attempt in 1 2 3 4 5; do
            git pull -q --rebase && git push -q && exit 0
            sleep $((attempt * 3))
          done
          exit 1
