---
# État du serveur qui sert le blog.
#
# Le périmètre s'arrête là où commence la publication : ce playbook décrit la
# machine, `make deploy` y dépose les fichiers. Un outil, un rôle.
#
# Il est écrit pour être relancé souvent, pas une fois : c'est ce qui le garde
# vrai. Un playbook qu'on n'exécute jamais vaut le markdown qu'il remplace.
#
#   ansible-playbook playbook.yml --check --diff   voir sans rien changer
#   ansible-playbook playbook.yml                  appliquer

- name: Serveur du blog
  hosts: labs
  become: true

  handlers:
    - name: Reload Caddy
      ansible.builtin.systemd:
        name: caddy
        state: reloaded

  tasks:
    # ---------------------------------------------------------------- base
    - name: Paquets de base
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - debian-keyring
          - debian-archive-keyring
          - apt-transport-https
          - ufw
          - fail2ban
          - unattended-upgrades
          - rsync            # requis par la synchronisation du site
        state: present
        update_cache: true
        cache_valid_time: 3600

    # Les correctifs de sécurité s'appliquent seuls. C'est la réponse directe à
    # la dérive silencieuse trouvée sur l'autre serveur : un démon qui tourne
    # sans jamais recevoir de correctif ne se signale pas.
    - name: Mises à jour de sécurité automatiques
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";

    - name: Fail2ban actif
      ansible.builtin.systemd:
        name: fail2ban
        enabled: true
        state: started

    # ---------------------------------------------------------------- réseau
    - name: Pare-feu — SSH, HTTP, HTTPS
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: ["22", "80", "443"]

    - name: Pare-feu — tout le reste refusé
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

    # ---------------------------------------------------------------- caddy
    # Le dépôt est DÉCLARÉ ici, pas ajouté à la main : une montée de version de
    # distribution supprime les sources tierces sans le dire, et le prochain
    # passage du playbook le rétablit.
    - name: Dossier des clés de dépôt
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Clé du dépôt Caddy
      ansible.builtin.get_url:
        url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
        dest: /etc/apt/keyrings/caddy-stable.asc
        mode: "0644"

    # Format deb822, celui qu'Ubuntu 26.04 utilise pour ses propres sources.
    - name: Dépôt Caddy
      ansible.builtin.deb822_repository:
        name: caddy-stable
        types: [deb]
        uris: https://dl.cloudsmith.io/public/caddy/stable/deb/debian
        suites: any-version
        components: [main]
        signed_by: /etc/apt/keyrings/caddy-stable.asc
        state: present
        enabled: true

    - name: Caddy installé
      ansible.builtin.apt:
        name: caddy
        state: present
        update_cache: true

    - name: Racine du site
      ansible.builtin.file:
        path: "{{ site_root }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Page d'attente, tant que rien n'est publié
      ansible.builtin.copy:
        dest: "{{ site_root }}/index.html"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"
        force: false          # ne jamais écraser un site déjà déployé
        content: |
          <!DOCTYPE html>
          <html lang="fr"><meta charset="utf-8"><title>BlackMesa Labs</title>
          <body style="font:16px system-ui;margin:4rem auto;max-width:32rem;padding:0 1rem">
          <p>Rien n’est encore publié ici.</p>
          </body></html>

    - name: Configuration de Caddy
      ansible.builtin.template:
        src: Caddyfile.j2
        dest: /etc/caddy/Caddyfile
        mode: "0644"
        validate: caddy validate --adapter caddyfile --config %s
      notify: Reload Caddy

    - name: Caddy actif au démarrage
      ansible.builtin.systemd:
        name: caddy
        enabled: true
        state: started

    # ---------------------------------------------------------------- contrôle
    # Vérifier plutôt que supposer : le playbook dit ce qu'il a obtenu.
    - name: Le site répond
      ansible.builtin.uri:
        url: http://localhost/
        status_code: 200
      changed_when: false

    - name: Récapitulatif
      ansible.builtin.debug:
        msg:
          - "Caddy sert {{ site_root }}"
          - "{{ site_domain | ternary('TLS pour ' ~ site_domain, 'Pas de domaine : HTTP seul, sur IP') }}"
          - "Pare-feu actif, correctifs de sécurité automatiques, fail2ban en service"
